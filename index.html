<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cool Boy Games</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #1e3c72, #2a5298);
    color: #fff;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {
    font-size: 3em;
    margin-bottom: 10px;
  }
  p {
    font-size: 1.2em;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
  }
  button {
    padding: 15px 25px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background-color: #ffcc00;
    transition: background 0.3s;
  }
  button:hover {
    background-color: #ffb700;
  }
  #game-container {
    width: 100%;
    max-width: 900px;
    min-height: 400px;
    background-color: rgba(255,255,255,0.1);
    border-radius: 15px;
    margin: 0 auto;
    padding: 20px;
  }
  iframe {
    width: 100%;
    height: 600px;
    border: none;
  }
</style>
</head>
<body>
<h1>🕶️ Cool Boy Games 🕶️</h1>
<p>Select a game to play!</p>
<div class="buttons">
  <button onclick="loadGame('shooter')">Time Shooter 🕹️</button>
  <button onclick="loadGame('shooter2')">Tine Shooter 2</button>
  <button onclick="loadGame('shooter3')">Tine Shooter 3</button>
  <button onclick="loadGame('racing')">TOP SPEED 3D</button>
</div>
<div id="game-container">
  <!-- Loaded game will appear here -->
</div>

<script>
  let currentGame = null;

  function loadGame(game) {
    const container = document.getElementById('game-container');

    // Clear previous game
    container.innerHTML = '';

    if (game === 'shooter') {
      // Embed Time Shooter from CrazyGames
      container.innerHTML = `
        <h2 style="color:#fff;">Time Shooter 🕹️</h2>
        <iframe src="https://www.crazygames.com/game/time-shooter" title="Time Shooter"></iframe>
      `;
    } else if (game === 'shooter2') {
      // Embed Tine Shooter 2
      container.innerHTML = `
        <h2 style="color:#fff;">Tine Shooter 2</h2>
        <iframe src="https://www.crazygames.com/game/tine-shooter-2" title="Tine Shooter 2"></iframe>
      `;
    } else if (game === 'shooter3') {
      // Embed Tine Shooter 3
      container.innerHTML = `
        <h2 style="color:#fff;">Tine Shooter 3</h2>
        <iframe src="https://www.crazygames.com/game/tine-shooter-3" title="Tine Shooter 3"></iframe>
      `;
    } else if (game === 'racing') {
      // Embed TOP SPEED 3D from Poki
      container.innerHTML = `
        <h2 style="color:#fff;">TOP SPEED 3D - Play Online for Free!</h2>
        <iframe src="https://poki.com/en/g/top-speed-3d" title="TOP SPEED 3D"></iframe>
      `;
    }
  }
</script>
</body>
</html>
